[project]
name = "phraselibs"
version = "0.1.0"
description = "Sentence-shaped passphrases, Mad Libs style: easy to read aloud and type on a phone."
readme = "README.md"
authors = [
    { name = "Scott Giese", email = "580239+sgiese@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
phraselibs = "phraselibs:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
